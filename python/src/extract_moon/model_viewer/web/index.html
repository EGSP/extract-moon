<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Архитектуры моделей</title>
  <!-- Шрифты грузятся без блокировки: без интернета остаётся системный шрифт. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@300;400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }}
  </script>
</head>
<body>
  <aside id="catalog">
    <header>
      <h1>Справочник моделей</h1>
      <input id="search" type="search" placeholder="Поиск: запуск, схема, заметка">
    </header>
    <div id="list"></div>
  </aside>
  <main>
    <div id="stage"></div>
    <div id="topbar">
      <div id="title"></div>
      <div id="tools">
        <button id="btn-overview" title="Показать всю модель (Home)">Обзор</button>
        <button id="btn-flow" class="on" title="Потоки данных (F)">Потоки</button>
        <button id="btn-labels" class="on" title="Подписи (L)">Подписи</button>
      </div>
    </div>
    <div id="warning" hidden></div>
    <div id="legend"></div>
    <div id="status">Загрузка справочника…</div>
  </main>
  <aside id="card"></aside>
  <script type="module" src="app.js"></script>
</body>
</html>
