[package]
name = "extract-moon-player"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
