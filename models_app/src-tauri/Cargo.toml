[package]
name = "extract-moon-models"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
extract-moon-shell = { path = "../../packages/shell" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
